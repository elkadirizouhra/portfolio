    <!--
      Applies the saved (or system) theme before first paint so the page never
      flashes the wrong colour scheme. Kept inline and tiny on purpose.
    -->
    <script>
      ;(function () {
        try {
          var saved = localStorage.getItem('zek-theme')
          var dark =
            saved === 'dark' ||
            (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {
          /* storage unavailable — fall through to the light theme */
        }
      })()
    </script>
